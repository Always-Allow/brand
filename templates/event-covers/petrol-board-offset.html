<style>body{margin:0;background:#fff}
@font-face { font-family:"AA Serif"; src:url("../../visual/fonts/2026.08.27_DMSerifDisplay_Regular_Latin.woff2") format("woff2"); font-weight:400; font-display:block; }
@font-face { font-family:"AA Sans"; src:url("../../visual/fonts/2026.08.27_Inter_Regular_Latin.woff2") format("woff2"); font-weight:400; font-display:block; }

.cover { width:1080px; height:1080px; position:relative; overflow:hidden;
  background:var(--canvas); color:var(--ink);
  font-family:"AA Sans",Inter,system-ui,sans-serif; }
.wash { position:absolute; inset:0; pointer-events:none; }
.wash::before { content:""; position:absolute; inset:0;
  background:
    radial-gradient(880px 620px at 88% -4%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 68%),
    radial-gradient(760px 520px at 4% 92%, color-mix(in srgb, var(--accent) 12%, transparent), transparent 72%); }
.petrol .wash::before { background:none; }
.lockup { position:absolute; top:60px; left:64px; z-index:6; }
.lockup svg { height:46px; width:auto; display:block; }
.info { position:absolute; left:64px; bottom:68px; right:64px; z-index:6; }
.meta { margin:0 0 18px; font-size:20px; letter-spacing:.15em; text-transform:uppercase;
  color:color-mix(in srgb, var(--ink) 58%, var(--canvas)); }
.info h1 { margin:0; font-family:"AA Serif",Georgia,serif; font-weight:400;
  font-size:88px; line-height:1.02; letter-spacing:-.012em; text-wrap:balance; }
.art { position:absolute; inset:0; z-index:2; }

.ftile { position:absolute; display:grid; place-items:center;
  width:var(--ts,62px); height:var(--ts,62px); border-radius:14px; background:#fff;
  box-shadow:0 1px 2px rgba(52,70,80,.10), 0 8px 18px rgba(52,70,80,.14); }
.ftile img { width:58%; height:58%; object-fit:contain; }

.mesh { position:absolute; inset:0; width:100%; height:100%; }
.mesh .quiet path { stroke:rgba(52,70,80,.30); stroke-width:2.6; stroke-linecap:round; fill:none; }
.mesh .mid path { stroke:rgba(52,70,80,.44); stroke-width:3.2; stroke-linecap:round; fill:none; }
.mesh .loud path { stroke:var(--accent); stroke-width:4.5; stroke-linecap:round; fill:none; opacity:.82; }

.stairs { position:absolute; inset:0; }
.tread { position:absolute; width:216px; text-align:center; }
.tread .line { display:block; height:2.5px; background:rgba(52,70,80,.4);
  border-radius:2px; margin-top:22px; }
.tread .line.lit { background:var(--accent); height:3.5px; }
.t1 { left:60px;  top:620px; } .t2 { left:312px; top:520px; }
.t3 { left:564px; top:420px; } .t4 { left:816px; top:296px; }
.sicon { display:inline-block; width:64px; height:64px;
  color:color-mix(in srgb, var(--ink) 62%, var(--canvas)); }
.sicon svg { width:100%; height:100%; fill:none; stroke:currentColor;
  stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
.smaster { display:inline-block; width:150px; }
.smaster svg { width:100%; height:auto; display:block; }

.ochip { position:absolute; padding:11px 20px; border-radius:999px;
  background:color-mix(in srgb, var(--accent) 10%, #fff);
  border:1.5px solid color-mix(in srgb, var(--accent) 24%, #fff);
  box-shadow:0 6px 16px rgba(52,70,80,.11);
  font-size:19px; font-weight:600; color:var(--accent); white-space:nowrap; }

.kb { position:absolute; top:168px; left:-160px; display:grid; gap:26px; }
.kbrow { display:flex; gap:26px; }
.kbrow:nth-child(2) { margin-left:72px; }
.kbrow:nth-child(3) { margin-left:144px; }
.key { width:126px; height:126px; border-radius:24px; display:grid; place-items:center; flex:none;
  background:linear-gradient(180deg,#FFFFFF 0%, var(--bone) 100%);
  box-shadow:0 8px 0 color-mix(in srgb, var(--accent) 62%, #16242c),
    0 20px 34px rgba(52,70,80,.22); }
.key img { width:58px; height:58px; object-fit:contain; }
.key.blank { box-shadow:0 8px 0 color-mix(in srgb, var(--accent) 34%, var(--bone-deep)),
    0 16px 28px rgba(52,70,80,.13); }
.key.cmdkey { color:var(--accent); }
.key.cmdkey .cmdg { width:62px; height:62px; }
.key.add { background:transparent; border:3px dashed rgba(52,70,80,.38); box-shadow:none; }
.petrol .key.add { border-color:rgba(240,236,230,.6); }
.key.add i { font-style:normal; font-size:64px; font-weight:300; color:rgba(52,70,80,.44); line-height:1; }
.petrol .key.add i { color:rgba(240,236,230,.7); }

.conn { position:absolute; inset:0; width:100%; height:100%; z-index:2; }
.conn path { stroke:rgba(52,70,80,.5); stroke-linecap:round; stroke-linejoin:round; }
.cpos, .kpos { position:absolute; z-index:3; }
.cmdchip { display:inline-block; padding:14px 26px; border-radius:16px;
  background:color-mix(in srgb, var(--accent) 10%, #fff);
  border:1.5px solid color-mix(in srgb, var(--accent) 26%, #fff);
  box-shadow:0 4px 0 color-mix(in srgb, var(--accent) 30%, var(--bone-deep)),
    0 12px 26px rgba(52,70,80,.13); }
.cmdchip code { font-family:"SF Mono",Menlo,Consolas,monospace; font-size:24px;
  font-weight:600; color:var(--accent); }
.cmdchip.big { padding:20px 34px; border-radius:20px; }
.cmdchip.big code { font-size:33px; }
.cmdchip.quiet { background:#fff; border-color:var(--bone-deep);
  box-shadow:0 3px 0 var(--bone-deep), 0 8px 18px rgba(52,70,80,.07); }
.cmdchip.quiet code { font-size:20px; color:color-mix(in srgb, var(--ink) 45%, var(--canvas)); }
.master { display:block; width:196px; }
.master svg { width:100%; height:auto; display:block; }

.petrol { background:radial-gradient(1300px 1300px at 78% 6%,
    color-mix(in srgb, var(--accent) 88%, #fff),
    var(--accent) 46%,
    color-mix(in srgb, var(--accent) 84%, #101c23) 100%); color:#F0ECE6; }
.pwash { position:absolute; inset:0;
  background:radial-gradient(700px 500px at 12% 100%, rgba(255,255,255,.10), transparent 70%); }
.plockup { position:absolute; top:56px; left:64px; z-index:6;
  display:flex; align-items:center; gap:16px; }
.pmark { display:block; width:64px; }
.pmark svg { width:100%; height:auto; display:block; }
.pname { font-family:"AA Serif",Georgia,serif; font-size:34px; color:#F0ECE6; }
.petrol .meta { color:rgba(240,236,230,.72); }
.petrol .info h1 { color:#F0ECE6; }
.petrol .key.blank { background:linear-gradient(180deg,rgba(255,255,255,.16) 0%, rgba(255,255,255,.07) 100%);
  box-shadow:0 8px 0 rgba(16,28,35,.5), 0 16px 28px rgba(16,28,35,.3); }
.petrol .key.cmdkey { color:var(--accent); }
